name: ByzantineTrail
options:
  bundleIdPrefix: com.byzantinetrail
  deploymentTarget:
    iOS: "17.0"
targets:
  ByzantineTrail:
    type: application
    platform: iOS
    sources:
      - path: ByzantineTrail
    info:
      path: ByzantineTrail/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byzantinetrail.app
        DEVELOPMENT_ASSETS: ByzantineTrail/Preview Content
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: XY62X6K9VH
        CODE_SIGN_STYLE: Automatic
    # CloudKit public database for M5a ratings. XcodeGen owns the entitlements
    # file (regenerated from these properties), so the container id can't drift.
    # Activation still needs a signing Team (see docs/CLOUDKIT_SETUP.md).
    entitlements:
      path: ByzantineTrail/ByzantineTrail.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.byzantinetrail.app
  ByzantineTrailTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ByzantineTrailTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ByzantineTrail
schemes:
  ByzantineTrail:
    build:
      targets:
        ByzantineTrail: all
        ByzantineTrailTests: [test]
    test:
      targets:
        - ByzantineTrailTests
    run:
      config: Debug
